name: Build

on:
  push:
    branches: [ "release", "dev" ]
  pull_request:
    branches: [ "release" ]

jobs:
  build:
    name: Build (${{ matrix.loader }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        loader: [ Common, Fabric, Forge, NeoForge ]

    defaults:
      run:
        working-directory: src/hzlib-1.21.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.loader }}-${{ hashFiles('src/hzlib-1.21.1/**/*.gradle*', 'src/hzlib-1.21.1/gradle.properties') }}
          restore-keys: |
            gradle-${{ matrix.loader }}-
            gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.loader }}:compileJava --no-daemon -PDCI=true
        env:
          TARGET_LOADER: ${{ matrix.loader }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hzlib-${{ matrix.loader }}-${{ github.sha }}
          path: src/hzlib-1.21.1/${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: ignore
