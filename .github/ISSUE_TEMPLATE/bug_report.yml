name: Bug Report
description: Something isn't working as expected. Thanks for taking the time to report it.
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Hey, thanks for the report! The more detail you give here, the faster we can track it down.
        Before submitting — check the [existing issues](../issues) to see if this has already been reported.

  - type: input
    id: hzlib-version
    attributes:
      label: HZLib Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      placeholder: "e.g. 1.21.1"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
    validations:
      required: true

  - type: textarea
    id: mods-list
    attributes:
      label: Other Mods Installed
      description: List all mods in your instance. Many bugs are caused by mod conflicts — this helps rule them out.
      placeholder: "e.g. LovelyLib 1.0.0, GeckoLib 4.x, ..."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What Happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What Did You Expect to Happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Set up NativeEntityFamily with...
        2. Call withFeature(...)
        3. See error
    validations:
      required: true

  - type: textarea
    id: code-snippet
    attributes:
      label: Code Snippet
      description: Show how you're using HZLib. Many "bugs" turn out to be usage issues — this helps us tell the difference fast.
      render: java

  - type: textarea
    id: crash-log
    attributes:
      label: Crash Log / latest.log
      description: Paste relevant log output here. Find it in `.minecraft/logs/latest.log`.
      render: text
